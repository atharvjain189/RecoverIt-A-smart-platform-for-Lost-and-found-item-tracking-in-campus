<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Lost & Found</title>
    <style>
           * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-box {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .auth-box h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
            font-size: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background: #1e40af;
            transform: translateY(-2px);
        }

        .password-hint {
            display: block;
            margin-top: 6px;
            color: #666;
            font-size: 12px;
        }

        .password-message {
            display: block;
            margin-top: 6px;
            font-size: 13px;
        }

        .password-message.error { color: #dc2626; }
        .password-message.success { color: #15803d; }

        .flash-message {
            padding: 10px 12px;
            margin-bottom: 16px;
            border-radius: 8px;
            font-size: 14px;
            background: #fee2e2;
            color: #991b1b;
        }

        .auth-link {
            text-align: center;
            margin-top: 22px;
            color: #666;
            font-size: 15px;
        }

        .auth-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 18px;
        }

        .back-home a {
            color: #1e3a8a;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .auth-box {
                padding: 30px 22px;
            }

            .auth-box h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<div class="auth-box">
    <h2>Create Account</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash-message" role="alert">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    <form id="register-form" action="{{url_for('register')}}" method="POST">
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter Your Full Name" required>
        </div>
        <div class="input-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Enter Your Email" required>
        </div>
        <div class="input-group">
            <label>Password</label>
            <input id="password" type="password" name="password" placeholder="Create Password" minlength="8" autocomplete="new-password" required>
            <small class="password-hint">Password must contain at least 8 characters.</small>
        </div>
        <div class="input-group">
            <label>Confirm Password</label>
            <input id="confirm" type="password" name="confirm" placeholder="Confirm Password" minlength="8" autocomplete="new-password" required>
            <small id="password-message" class="password-message" aria-live="polite"></small>
        </div>
        <button type="submit" class="btn">Register</button>
        <p class="auth-link">Already have an account?<a href="{{url_for('login')}}">Login</a></p>
        <div class="back-home">
            <a href="{{url_for('home')}}"><- Back to Home</a>
        </div>
    </form>
</div>

<script>
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm');
    const passwordMessage = document.getElementById('password-message');
    const registerForm = document.getElementById('register-form');

    function checkPasswordMatch() {
        if (!confirmInput.value) {
            passwordMessage.textContent = '';
            passwordMessage.className = 'password-message';
            confirmInput.setCustomValidity('');
            return;
        }

        if (passwordInput.value !== confirmInput.value) {
            passwordMessage.textContent = 'Passwords do not match.';
            passwordMessage.className = 'password-message error';
            confirmInput.setCustomValidity('Passwords do not match.');
        } else {
            passwordMessage.textContent = 'Passwords match.';
            passwordMessage.className = 'password-message success';
            confirmInput.setCustomValidity('');
        }
    }

    passwordInput.addEventListener('input', checkPasswordMatch);
    confirmInput.addEventListener('input', checkPasswordMatch);
    registerForm.addEventListener('submit', function (event) {
        checkPasswordMatch();
        if (passwordInput.value.length < 8 || passwordInput.value !== confirmInput.value) {
            event.preventDefault();
            if (passwordInput.value.length < 8) {
                passwordInput.setCustomValidity('Password must be at least 8 characters long.');
                passwordInput.reportValidity();
            } else {
                confirmInput.reportValidity();
            }
        } else {
            passwordInput.setCustomValidity('');
        }
    });
</script>
</body>
</html>
