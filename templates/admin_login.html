<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Admin Login</title>

    <style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #eff6ff;
    color: #1e293b;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 16px;
}

.login-container {
    display: block;
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding: 32px;
    background: #ffffff;
    border: 1px solid #dbeafe;
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(30, 58, 138, 0.12);
}

h1 {
    margin: 0 0 14px;
    color: #233f8b;
    font-size: 30px;
    line-height: 1.3;
}

p {
    line-height: 1.6;
}

.subtitle {
    margin-bottom: 22px;
    color: #475569;
}

label {
    display: block;
    margin: 16px 0 8px;
    color: #334155;
    font-size: 14px;
    font-weight: bold;
}

input[type="text"],
input[type="password"] {
    display: block;
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    background: #ffffff;
    color: #1e293b;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

button,
button[type="submit"] {
    display: block;
    width: 100%;
    max-width: 100%;
    margin-top: 20px;
    padding: 14px 16px;
    border: none;
    border-radius: 9px;
    background: #233f8b;
    color: #ffffff;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
}

button:hover {
    background: #1b3270;
}




.box a.back-link {
    display: block;
    width: 100%;
    padding: 14px 16px;
    margin-top: 12px;
    background: #233f8b;
    color: #ffffff !important;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
    text-decoration: none !important;
    cursor: pointer;
    transition: background 0.3s ease;
}

.box a.back-link:hover {
    background: #1b3270;
    color: #ffffff !important;
}

.flash-message {
    margin: 12px 0;
    padding: 12px;
    border-radius: 8px;
    background: #fee2e2;
    color: #991b1b;
    overflow-wrap: anywhere;
}

@media (max-width: 480px) {
    body {
        padding: 16px;
    }

    .login-container {
        width: 100%;
        max-width: 100%;
        padding: 24px 20px;
    }

    h1 {
        font-size: 26px;
    }
}
</style>
</head>

<body>

    <form class="box" method="post">

        <h1>Admin Portal</h1>

        <p>
            Sign in to review private Found reports and matches.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <p class="msg">{{ message }}</p>

            {% endfor %}

        {% endwith %}

        <label>Username</label>

        <input
            name="username"
            required
            autocomplete="username"
        >

        <label>Password</label>

        <input
            name="password"
            type="password"
            required
            autocomplete="current-password"
        >

        <button>Login</button>

        <a class="back-link" href="{{ url_for('home') }}">
            Back to home
        </a>

    </form>

</body>
</html>
